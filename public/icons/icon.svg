<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>LexiVault</title>
  <defs>
    <clipPath id="lv-sq">
      <rect x="0" y="0" width="512" height="512" rx="116" />
    </clipPath>
    <linearGradient id="lv-navy" x1="48" y1="16" x2="464" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="52%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#091020" />
    </linearGradient>
    <radialGradient id="lv-halo" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28" />
      <stop offset="56%" stop-color="#1E293B" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lv-rim" x1="16" y1="16" x2="496" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.88" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.82" />
    </linearGradient>
    <linearGradient id="lv-topSpec" x1="112" y1="14" x2="400" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lv-sheen" x1="256" y1="0" x2="256" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed dark navy base for maskable icons -->
  <rect x="0" y="0" width="512" height="512" fill="#0F172A" />

  <g clip-path="url(#lv-sq)">
    <rect x="0" y="0" width="512" height="512" fill="url(#lv-navy)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#lv-halo)" />
    <circle cx="256" cy="252" r="188" fill="#263652" fill-opacity="0.3" />

    <!-- Smooth Rounded Neck & Chest -->
    <path
      d="M 164 342 C 128 386, 102 444, 92 516 L 414 516 C 402 442, 372 384, 334 342 Z"
      fill="#1E2534"
      stroke="#080C15"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <path d="M 168 358 C 140 402, 120 452, 110 512 L 158 512 C 164 456, 174 404, 192 362 Z" fill="#2B364C" />
    <path d="M 326 356 C 352 400, 376 452, 386 512 L 404 512 C 392 444, 366 390, 332 348 Z" fill="#131824" />

    <!-- Warm Symmetric Mahogany-Tan Chest Blazes -->
    <path
      d="M 178 408 C 202 396, 238 410, 250 442 C 254 464, 244 488, 224 494 C 194 490, 172 464, 168 434 C 166 420, 170 412, 178 408 Z"
      fill="#EE913E"
    />
    <path d="M 172 444 C 184 470, 210 484, 238 480 C 232 492, 218 496, 200 492 C 178 482, 168 462, 172 444 Z" fill="#CC6C22" />

    <path
      d="M 332 404 C 308 394, 274 410, 266 442 C 262 464, 274 488, 294 492 C 322 488, 344 462, 346 432 C 348 418, 342 408, 332 404 Z"
      fill="#EE913E"
    />
    <path d="M 344 442 C 334 468, 310 482, 282 478 C 288 490, 302 494, 318 490 C 338 480, 348 460, 344 442 Z" fill="#CC6C22" />

    <!-- Jaw Cast Shadow -->
    <path d="M 164 362 Q 258 424 342 358 Q 262 394 164 362 Z" fill="#090D16" fill-opacity="0.65" />

    <!-- Slightly Right-Tilted Friendly 3/4 Head Group -->
    <g transform="rotate(4.5 256 250)">
      <!-- Far-Right Soft Triangular Ear -->
      <path
        d="M 314 122 C 350 118, 384 138, 396 178 C 402 204, 396 238, 380 248 C 366 256, 350 238, 340 212 Z"
        fill="#131926"
        stroke="#080C15"
        stroke-width="12"
        stroke-linejoin="round"
      />
      <path d="M 326 134 C 354 134, 376 154, 384 184 C 374 168, 354 156, 330 150 Z" fill="#273248" />

      <!-- Main Rounded Expressive Rottweiler Head -->
      <path
        d="M 244 96 C 306 94, 352 128, 360 188 C 368 238, 366 288, 346 330 C 326 372, 296 394, 258 396 C 212 398, 170 374, 148 330 C 128 288, 128 232, 142 182 C 156 128, 194 98, 244 96 Z"
        fill="#1E2534"
        stroke="#080C15"
        stroke-width="12"
        stroke-linejoin="round"
      />
      <path d="M 184 132 C 214 108, 278 106, 314 128 C 284 142, 224 144, 184 132 Z" fill="#303D55" />
      <path d="M 144 238 C 146 300, 176 358, 232 386 C 186 380, 152 348, 138 300 C 132 276, 136 254, 144 238 Z" fill="#131926" />

      <!-- Seamless Warm Tan Cheeks + Snout + Chin -->
      <path
        d="M 164 254 C 188 248, 214 264, 226 276 C 240 264, 256 258, 270 258 C 286 258, 300 264, 312 274 C 322 260, 336 250, 348 254 C 358 262, 358 296, 344 328 C 334 348, 316 364, 298 374 C 286 382, 274 386, 260 386 C 242 386, 224 380, 210 368 C 188 358, 166 336, 156 304 C 150 282, 154 260, 164 254 Z"
        fill="#F2994A"
      />
      <path
        d="M 160 296 C 170 330, 194 356, 226 372 C 254 384, 294 382, 326 350 C 340 336, 350 314, 354 292 C 348 332, 322 368, 286 382 C 256 392, 220 382, 190 358 C 168 340, 156 318, 160 296 Z"
        fill="#D17024"
      />
      <ellipse cx="188" cy="284" rx="16" ry="9" transform="rotate(18 188 284)" fill="#FFC082" fill-opacity="0.52" />
      <ellipse cx="238" cy="296" rx="15" ry="8.5" transform="rotate(-10 238 296)" fill="#FFC082" fill-opacity="0.46" />
      <ellipse cx="304" cy="294" rx="12" ry="7.5" transform="rotate(12 304 294)" fill="#FFC082" fill-opacity="0.4" />

      <!-- Glossy Black Nasal Bridge -->
      <path d="M 234 214 C 248 210, 276 210, 288 214 L 288 266 C 276 260, 256 260, 244 266 Z" fill="#1E2534" />
      <path d="M 248 218 C 256 216, 264 216, 272 218 L 270 254 L 250 254 Z" fill="#2C374E" />

      <!-- Expressive Round Tan Eyebrows -->
      <ellipse cx="204" cy="172" rx="23" ry="13" transform="rotate(-14 204 172)" fill="#F2994A" stroke="#080C15" stroke-width="6" />
      <ellipse cx="202" cy="168" rx="12" ry="4.5" transform="rotate(-14 202 168)" fill="#FFC585" fill-opacity="0.7" />

      <ellipse cx="306" cy="170" rx="21" ry="12.5" transform="rotate(14 306 170)" fill="#F2994A" stroke="#080C15" stroke-width="6" />
      <ellipse cx="304" cy="166" rx="10.5" ry="4.2" transform="rotate(14 304 166)" fill="#FFC585" fill-opacity="0.7" />

      <!-- Big Round Warm Eyes with Double Sparkle Highlights -->
      <ellipse cx="208" cy="224" rx="25" ry="27" fill="#0B0E17" stroke="#080B12" stroke-width="5.5" />
      <path d="M 192 236 A 19 19 0 0 0 224 236 A 22 18 0 0 1 192 236 Z" fill="#94471B" />
      <circle cx="208" cy="223" r="14" fill="#05060A" />
      <circle cx="199" cy="213" r="8.6" fill="#FFFFFF" />
      <circle cx="218" cy="234" r="4.2" fill="#FFFFFF" fill-opacity="0.92" />

      <ellipse cx="304" cy="222" rx="22.5" ry="26" fill="#0B0E17" stroke="#080B12" stroke-width="5.5" />
      <path d="M 290 234 A 17 17 0 0 0 318 234 A 20 17 0 0 1 290 234 Z" fill="#94471B" />
      <circle cx="304" cy="221" r="12.8" fill="#05060A" />
      <circle cx="296" cy="212" r="7.8" fill="#FFFFFF" />
      <circle cx="313" cy="232" r="3.8" fill="#FFFFFF" fill-opacity="0.92" />

      <!-- Happy Open Smile & Cute Pink Tongue -->
      <path
        d="M 216 316 Q 244 330 268 314 Q 292 330 316 314 C 312 354, 292 368, 266 368 C 240 368, 220 352, 216 316 Z"
        fill="#4C1127"
        stroke="#080C15"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <path
        d="M 244 334 C 242 368, 256 384, 274 382 C 292 380, 298 360, 292 332 C 278 326, 258 326, 244 334 Z"
        fill="#FF7CA8"
        stroke="#080C15"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <path d="M 248 358 C 254 374, 268 380, 282 374 C 290 370, 294 358, 292 346 C 284 366, 262 370, 248 358 Z" fill="#E55386" />
      <path d="M 268 334 Q 270 352 269 364" stroke="#B83264" stroke-width="4.2" stroke-linecap="round" />
      <ellipse cx="258" cy="346" rx="5.5" ry="3.2" transform="rotate(-18 258 346)" fill="#FFC8DC" fill-opacity="0.85" />

      <path d="M 268 292 L 268 314" stroke="#080C15" stroke-width="8" stroke-linecap="round" />
      <path d="M 210 310 Q 240 334 268 314 Q 296 334 322 308" stroke="#080C15" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Cute Glossy Rounded Nose -->
      <path
        d="M 268 254 C 288 254, 300 262, 298 276 C 296 288, 280 298, 268 298 C 256 298, 240 288, 238 276 C 236 262, 248 254, 268 254 Z"
        fill="#151C2B"
        stroke="#080C15"
        stroke-width="8.5"
        stroke-linejoin="round"
      />
      <ellipse cx="264" cy="266" rx="16" ry="6" fill="#475569" />
      <ellipse cx="258" cy="264" rx="7" ry="2.8" fill="#E2E8F0" fill-opacity="0.82" />
      <ellipse cx="254" cy="279" rx="5.5" ry="3.8" transform="rotate(-18 254 279)" fill="#06080F" />
      <ellipse cx="282" cy="279" rx="5.5" ry="3.8" transform="rotate(18 282 279)" fill="#06080F" />

      <!-- Near-Left Soft Triangular Drooping Ear -->
      <path
        d="M 168 128 C 132 126, 98 148, 92 192 C 88 226, 94 266, 114 278 C 128 286, 148 262, 160 226 C 170 198, 174 160, 168 128 Z"
        fill="#1E2534"
        stroke="#080C15"
        stroke-width="12"
        stroke-linejoin="round"
      />
      <path
        d="M 162 146 C 142 164, 128 202, 124 246 C 122 260, 124 270, 118 274 C 134 272, 148 246, 158 216 C 166 190, 168 164, 162 146 Z"
        fill="#131926"
      />
      <path d="M 154 140 C 126 144, 106 168, 104 206 C 110 180, 128 158, 154 148 Z" fill="#334155" />
    </g>

    <!-- iOS Dark Liquid Glass Sheen & Rim Light -->
    <path d="M 0 116 C 0 52, 52 0, 116 0 H 396 C 460 0, 512 52, 512 116 V 156 C 412 196, 100 196, 0 156 Z" fill="url(#lv-sheen)" />
    <path d="M 116 14 H 396" stroke="url(#lv-topSpec)" stroke-width="4" stroke-linecap="round" />
    <rect x="4" y="4" width="504" height="504" rx="112" stroke="url(#lv-rim)" stroke-width="5" stroke-opacity="0.84" />
    <rect x="10" y="10" width="492" height="492" rx="106" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.8" />
  </g>
</svg>
